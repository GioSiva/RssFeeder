name: Publish RSS to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Atualiza o feed de hora a hora (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://giosiva.github.io/RssFeeder
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feeds
        run: |
          mkdir -p site
          for preset in pokebeach gameinformer; do
            python -m rssfeeder.cli "${preset}" \
              --site-url "${SITE_URL}" \
              > "site/${preset}.xml"
          done
          cp public/index.html site/index.html
          cp public/.nojekyll site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
