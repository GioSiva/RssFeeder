id: gameinformer
title: Game Informer — News & features
site_url: https://giosiva.github.io/RssFeeder
page_url: https://gameinformer.com/news
description: >-
  Game Informer /news page 1 in website order (not sorted by date).
  The site highlights three News items at the top; State of Play and other
  sections follow. Many RSS readers re-sort by publication date, so newer
  News may appear above State of Play even though the XML matches the site.
list_selector: ".region.region-content article.node--type-article"
max_pages: 1
item_sort: dom
item_title_selector: "h2.page-title a, h3.page-title a"
item_link_selector: "h2.page-title a[rel=bookmark], h3.page-title a[rel=bookmark]"
item_author_selector: "a.username"
item_date_selector: time
item_date_attribute: datetime
item_image_selector: ".field--name-field-promo-image"
item_comments_selector: ""
language: en
